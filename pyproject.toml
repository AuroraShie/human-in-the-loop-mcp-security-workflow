[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-human-in-the-loop-workflow"
version = "0.1.0"
description = "A stateful MCP workflow adapter with human confirmation and stage gates."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
